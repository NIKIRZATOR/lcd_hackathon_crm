services:
  backend:
    # The base file publishes 8000 for direct development.  Demo replicas are
    # reachable only through Nginx, so Docker can create an arbitrary number.
    ports: !reset []

  nginx:
    image: nginx:1.27-alpine
    profiles: ["demo"]
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
