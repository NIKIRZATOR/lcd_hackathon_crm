services:
  postgres:
    image: postgres:16-alpine
    container_name: rtk-eduflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rtk_eduflow}
      POSTGRES_USER: ${POSTGRES_USER:-rtk_eduflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtk_eduflow}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-keycloak-db.sh:/docker-entrypoint-initdb.d/10-init-keycloak-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: rtk-eduflow-backend
    environment:
      APP_NAME: ${APP_NAME:-edu_crm}
      APP_ENV: development
      DEBUG: "true"
      API_PREFIX: /api
      DATABASE_URL: postgresql+psycopg://rtk_eduflow:rtk_eduflow@postgres:5432/rtk_eduflow
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-rtk-eduflow}
      KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-rtk-eduflow-frontend}
      KEYCLOAK_BACKEND_CLIENT_ID: ${KEYCLOAK_BACKEND_CLIENT_ID:-rtk-eduflow-backend}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-rtk-eduflow-backend}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rtk_eduflow_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rtk_eduflow_minio_secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_BUCKET_WORKFLOW_FILES: ${S3_BUCKET_WORKFLOW_FILES:-workflow-files}
      S3_BUCKET_IMPORTS: ${S3_BUCKET_IMPORTS:-imports}
      S3_BUCKET_REPORTS: ${S3_BUCKET_REPORTS:-reports}
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-30}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    container_name: rtk-eduflow-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rtk_eduflow_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-rtk_eduflow_minio_secret}
      MINIO_REGION_NAME: ${S3_REGION:-us-east-1}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: rtk-eduflow-minio-init
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rtk_eduflow_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rtk_eduflow_minio_secret}
      S3_BUCKET_WORKFLOW_FILES: ${S3_BUCKET_WORKFLOW_FILES:-workflow-files}
      S3_BUCKET_IMPORTS: ${S3_BUCKET_IMPORTS:-imports}
      S3_BUCKET_REPORTS: ${S3_BUCKET_REPORTS:-reports}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET_WORKFLOW_FILES"
        mc mb --ignore-existing "local/$$S3_BUCKET_IMPORTS"
        mc mb --ignore-existing "local/$$S3_BUCKET_REPORTS"
    depends_on:
      minio:
        condition: service_healthy

  keycloak-db-init:
    image: postgres:16-alpine
    container_name: rtk-eduflow-keycloak-db-init
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rtk_eduflow}
      POSTGRES_USER: ${POSTGRES_USER:-rtk_eduflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtk_eduflow}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
      PGPASSWORD: ${POSTGRES_PASSWORD:-rtk_eduflow}
      POSTGRES_HOST: postgres
    volumes:
      - ./scripts/init-keycloak-db.sh:/scripts/init-keycloak-db.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init-keycloak-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: rtk-eduflow-frontend
    environment:
      VITE_APP_NAME: ${APP_NAME:-edu_crm}
      VITE_API_URL: http://localhost:8000
      VITE_KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
      VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-rtk-eduflow}
      VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-rtk-eduflow-frontend}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: rtk-eduflow-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-rtk_eduflow}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-rtk_eduflow}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  frontend_node_modules:
  minio_data:
