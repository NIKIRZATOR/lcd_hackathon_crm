services:
  postgres:
    image: postgres:16-alpine
    container_name: rtk-eduflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rtk_eduflow}
      POSTGRES_USER: ${POSTGRES_USER:-rtk_eduflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtk_eduflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: rtk-eduflow-backend
    environment:
      APP_NAME: ${APP_NAME:-edu_crm}
      APP_ENV: development
      DEBUG: "true"
      API_PREFIX: /api
      DATABASE_URL: postgresql+psycopg://rtk_eduflow:rtk_eduflow@postgres:5432/rtk_eduflow
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: rtk-eduflow-frontend
    environment:
      VITE_APP_NAME: ${APP_NAME:-edu_crm}
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
